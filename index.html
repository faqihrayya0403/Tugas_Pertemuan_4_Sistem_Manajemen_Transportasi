<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Transportasi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .header p {
            opacity: 0.9;
        }

        .container {
            width: min(1000px, 92%);
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #1d4ed8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        .button-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .summary {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-box {
            flex: 1;
            background: #eff6ff;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .summary-box strong {
            display: block;
            font-size: 26px;
            color: #2563eb;
            margin-bottom: 5px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f8fafc;
            color: #374151;
        }

        tr:hover td {
            background: #f8fbff;
        }

        .badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px 12px;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 25px;
        }

        @media (max-width: 750px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .summary {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🚗 Sistem Manajemen Transportasi</h1>
        <p>Pengelolaan data pelanggan yang sedang menyewa kendaraan</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Tambah Data Penyewaan</h2>

            <form id="formPelanggan">
                <div class="form-grid">
                    <div>
                        <label for="nama">Nama Pelanggan</label>
                        <input type="text" id="nama" placeholder="Masukkan nama" required>
                    </div>

                    <div>
                        <label for="nomorTelepon">Nomor Telepon</label>
                        <input type="tel" id="nomorTelepon" placeholder="08xxxxxxxxxx" required>
                    </div>

                    <div>
                        <label for="kendaraan">Kendaraan Disewa</label>
                        <select id="kendaraan" required>
                            <option value="">-- Pilih kendaraan --</option>
                            <option value="Toyota Avanza">Toyota Avanza</option>
                            <option value="Honda Brio">Honda Brio</option>
                            <option value="Toyota Innova">Toyota Innova</option>
                            <option value="Honda Vario">Honda Vario</option>
                            <option value="Yamaha NMAX">Yamaha NMAX</option>
                        </select>
                    </div>
                </div>

                <div class="button-area">
                    <button type="submit" class="btn-primary">+ Catat Penyewaan</button>
                    <button type="reset" class="btn-secondary">Reset</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Daftar Pelanggan yang Sedang Menyewa</h2>

            <div class="summary">
                <div class="summary-box">
                    <strong id="jumlahPelanggan">0</strong>
                    Pelanggan
                </div>
                <div class="summary-box">
                    <strong id="jumlahKendaraan">0</strong>
                    Kendaraan Disewa
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Nomor Telepon</th>
                            <th>Kendaraan</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPelanggan">
                        <tr>
                            <td colspan="6" class="empty">Belum ada data penyewaan.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
